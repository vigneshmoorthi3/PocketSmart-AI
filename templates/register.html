<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - PocketSmart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 85% 15%, #0f274a 0%, #06111f 55%, #02060d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      color: #f1f5f9;
    }

    .brand-title {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .brand-subtitle {
      font-size: 15px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 25px;
      text-align: center;
    }

    .auth-card {
      background: rgba(13, 27, 49, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 35px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(56, 189, 248, 0.16);
      text-align: center;
    }

    .auth-heading {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper span {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 16px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      font-size: 14px;
      background: rgba(6, 17, 31, 0.8);
      color: #f1f5f9;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #4f46e5 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
      transition: all 0.25s ease;
    }

    .btn-submit:hover {
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.55);
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .bottom-switch {
      margin-top: 20px;
      font-size: 14px;
      color: #94a3b8;
    }

    .bottom-switch a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .bottom-switch a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="brand-title">PocketSmart</div>
  <div class="brand-subtitle">AI-Powered Budget Planning</div>

  <div class="auth-card">
    <div class="auth-heading">Create Your Account</div>

    {% if error %}
    <div class="alert-error">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/register" method="post">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <span>👤</span>
          <input type="text" name="username" placeholder="Choose a username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <span>✉</span>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span>🔒</span>
          <input type="password" name="password" placeholder="Create a strong password" required>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrapper">
          <span>✔</span>
          <input type="password" name="confirm_password" placeholder="Confirm your password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Create Account 👤⁺</button>
    </form>

    <div class="bottom-switch">
      Already have an account? <a href="/login">Sign In</a>
    </div>
  </div>

</body>
</html>
