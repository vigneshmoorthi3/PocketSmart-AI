<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PocketSmart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0b1e36 0%, #112d4e 50%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .brand-title {
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .brand-subtitle {
      font-size: 15px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 25px;
      text-align: center;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 35px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    .auth-heading {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
    }

    .alert-success {
      background-color: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background-color: #fee2e2;
      border: 1px solid #f87171;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper span {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 16px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
      margin-top: 6px;
      margin-bottom: 22px;
      cursor: pointer;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      background: #1e3a8a;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #172554;
    }

    .bottom-switch {
      margin-top: 22px;
      font-size: 14px;
      color: #475569;
    }

    .bottom-switch a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="brand-title">PocketSmart</div>
  <div class="brand-subtitle">AI-Powered Budget Planning</div>

  <div class="auth-card">
    <div class="auth-heading">Welcome Back</div>

    {% if success %}
    <div class="alert-success">
      <span>✅</span>
      <span>{{ success }}</span>
    </div>
    {% endif %}

    {% if error %}
    <div class="alert-error">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/login" method="post">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <span>👤</span>
          <input type="text" name="username" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span>🔒</span>
          <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        <span onclick="handleForgotPassword()" class="forgot-link">Forgot Password?</span>
      </div>

      <button type="submit" class="btn-submit">Sign In &rarr;</button>
    </form>

    <div class="bottom-switch">
      Don't have an account? <a href="/register">Create Account</a>
    </div>
  </div>

  <script>
    function handleForgotPassword() {
      const email = prompt("Enter your registered email address to receive password reset link:");
      if (email) {
        alert("A temporary password reset link has been sent to " + email + ".");
      }
    }
  </script>

</body>
</html>
